name = 'portfolio'
compatibility_date = "2026-08-06"
pages_build_output_dir = "dist"

# This project deploys as Cloudflare Pages (static build + Pages Functions
# under functions/), not a standalone Worker — pages_build_output_dir is
# what puts wrangler in Pages mode. Build command is `bun run build`
# (astro build + the postbuild obfuscation pass), set the same way in the
# Cloudflare dashboard's Pages project settings.
#
# functions/api/contact.js requires two secrets, set via the Cloudflare
# dashboard (Pages project > Settings > Environment variables) or
# `wrangler pages secret put <NAME>` — never committed here:
#   RESEND_API_KEY       — sends the contact-form email via Resend
#   TURNSTILE_SECRET_KEY — server-side verification for the Turnstile widget
#
# Optional, plain (non-secret) env var — also set under Environment variables:
#   TURNSTILE_HOSTNAMES — comma-separated hostnames allowed to have solved the
#     Turnstile token (e.g. "samuelabhinav.com,your-project.pages.dev"). Left
#     unset, hostname checking is skipped rather than rejecting everything —
#     see the comment in functions/api/contact.js for why.

# functions/api/contact.js optionally rate-limits (5 requests/60s per IP)
# via an env.RATE_LIMITER binding — but Pages projects' wrangler.toml does
# NOT support the top-level [[ratelimits]] block (that's Workers-only
# config; "does not support ratelimits" fails Pages' config validation at
# deploy time). For a Pages project this binding has to be added through
# the dashboard instead: Pages project > Settings > Functions > Bindings >
# Rate limiting, bound to the name RATE_LIMITER, 5 requests / 60s. The
# contact function already guards for its absence (`if (env.RATE_LIMITER)`),
# so the endpoint works fine without it too — just unrate-limited until the
# binding is added.
