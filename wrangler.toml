name = "portfolio"
compatibility_date = "2026-08-06"
pages_build_output_dir = "dist"

# Plain (non-secret) vars. A wrangler.toml in the project root makes Pages
# treat this file as the sole source of truth for bindings/vars — the
# dashboard's Environment variables UI gets locked out for these once this
# file exists, so TURNSTILE_HOSTNAMES has to live here, not there. Secrets
# (below) are the one exception: they're never safe to commit, so they still
# go through the dashboard/`wrangler pages secret put` regardless.
[vars]
TURNSTILE_HOSTNAMES = "samuelabhinav.com"

# This project deploys as Cloudflare Pages (static build + Pages Functions
# under functions/), not a standalone Worker — pages_build_output_dir is
# what puts wrangler in Pages mode. Build command is `bun run build`
# (astro build + the postbuild obfuscation pass), set the same way in the
# Cloudflare dashboard's Pages project settings.
#
# functions/api/contact.js requires two secrets, set via the Cloudflare
# dashboard (Pages project > Settings > Environment variables) or
# `wrangler pages secret put <NAME>` — never committed here:
#   RESEND_API_KEY       — sends the contact-form email via Resend
#   TURNSTILE_SECRET_KEY — server-side verification for the Turnstile widget
#
# TURNSTILE_HOSTNAMES (set above, under [vars]) restricts which hostnames a
# solved Turnstile token is accepted from — since it's set now, previewing
# the contact form on a *.pages.dev preview deployment will fail Turnstile
# verification (expected: those hostnames aren't in the allowlist). Test
# against the production domain instead.

# functions/api/{contact,clienterr,luna-miss}.js rate-limit via a shared
# RATE_LIMIT_KV binding (functions/_lib/rate-limit.js) — deliberately left
# unconfigured for now. Cloudflare's native Rate Limiting binding (the one
# with a .limit({key}) method) is what these three used to call, but it's
# unreliable to configure for this Pages project (no top-level [[ratelimits]]
# support, and once this file exists the dashboard's own binding UI is
# locked out for everything, including that binding type). A plain KV
# namespace binding doesn't have that problem — it's the well-supported case
# — so the rate limiter is now implemented on top of one instead (a simple
# fixed-window counter per key, see rate-limit.js).
#
# Contact.js's own case for skipping this originally still mostly holds:
# Turnstile already requires a fresh, single-use solve per submission, which
# caps abuse throughput on its own, and Cloudflare's network-level DDoS
# protection covers volumetric attacks regardless. clienterr.js/luna-miss.js
# have no such protection of their own, though, so they're the ones that
# actually benefit from this being real. All three fail open if the binding
# below stays commented out — nothing breaks by leaving this as-is.
#
# To activate: `wrangler login`, then `wrangler kv namespace create
# rate-limit` — it prints an id — then uncomment the block below and paste
# that id in. No dashboard step needed (bindings live here once this file
# exists), which also means: don't add this in the dashboard, it won't take.
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_THE_ID_FROM_WRANGLER_KV_NAMESPACE_CREATE"
