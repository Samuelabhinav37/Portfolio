name = "portfolio"
compatibility_date = "2026-08-06"
pages_build_output_dir = "dist"

# Plain (non-secret) vars. A wrangler.toml in the project root makes Pages
# treat this file as the sole source of truth for bindings/vars — the
# dashboard's Environment variables UI gets locked out for these once this
# file exists, so TURNSTILE_HOSTNAMES has to live here, not there. Secrets
# (below) are the one exception: they're never safe to commit, so they still
# go through the dashboard/`wrangler pages secret put` regardless.
[vars]
TURNSTILE_HOSTNAMES = "samuelabhinav.com"

# This project deploys as Cloudflare Pages (static build + Pages Functions
# under functions/), not a standalone Worker — pages_build_output_dir is
# what puts wrangler in Pages mode. Build command is `bun run build`
# (astro build + the postbuild obfuscation pass), set the same way in the
# Cloudflare dashboard's Pages project settings.
#
# functions/api/contact.js requires two secrets, set via the Cloudflare
# dashboard (Pages project > Settings > Environment variables) or
# `wrangler pages secret put <NAME>` — never committed here:
#   RESEND_API_KEY       — sends the contact-form email via Resend
#   TURNSTILE_SECRET_KEY — server-side verification for the Turnstile widget
#
# TURNSTILE_HOSTNAMES (set above, under [vars]) restricts which hostnames a
# solved Turnstile token is accepted from — since it's set now, previewing
# the contact form on a *.pages.dev preview deployment will fail Turnstile
# verification (expected: those hostnames aren't in the allowlist). Test
# against the production domain instead.

# functions/api/contact.js optionally rate-limits (5 requests/60s per IP) via
# an env.RATE_LIMITER binding — deliberately left unconfigured. Pages
# projects' wrangler.toml does not support the top-level [[ratelimits]]
# block, rate-limiting bindings declared elsewhere in wrangler.toml are
# unreliable for Pages production deploys, and once this file exists the
# dashboard's own binding UI is locked out anyway — three dead ends for one
# binding. Skipped as not worth it: Turnstile already requires a fresh,
# single-use solve per submission, which caps abuse throughput on its own,
# and Cloudflare's network-level DDoS protection covers volumetric attacks
# regardless. The contact function already guards for RATE_LIMITER's absence
# (`if (env.RATE_LIMITER)`), so revisit this only if abuse actually shows up.
