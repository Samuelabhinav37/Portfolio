<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>404 — Signal Lost · Samuel Abhinav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#05060a; color:rgba(205,214,226,0.92);
    font-family:'JetBrains Mono', monospace;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:2rem;
    background-image:
      radial-gradient(1200px 600px at 50% -10%, rgba(120,140,180,0.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.020) 0 1px, transparent 1px 3px);
  }
  .wrap{ max-width:560px; }
  .code{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size:clamp(5rem, 18vw, 9rem); line-height:0.9; font-weight:500;
    letter-spacing:0.02em; color:#eef2f8;
    text-shadow:0 0 24px rgba(140,165,210,0.25);
  }
  .status{ margin-top:1.25rem; font-size:0.78rem; letter-spacing:0.35em; text-transform:uppercase; color:rgba(160,172,190,0.75); }
  .msg{ margin-top:0.9rem; font-size:0.9rem; color:rgba(180,190,206,0.68); }
  .home{
    display:inline-block; margin-top:2rem; padding:0.7rem 1.4rem;
    font-size:0.8rem; letter-spacing:0.12em; text-transform:uppercase; text-decoration:none;
    color:rgba(220,228,240,0.9);
    border:1px solid rgba(205,214,226,0.18); border-radius:2px;
    transition:border-color .2s ease, background .2s ease;
  }
  .home:hover{ border-color:rgba(205,214,226,0.4); background:rgba(205,214,226,0.05); }
  .prompt{ margin-top:1.6rem; font-size:0.72rem; color:rgba(120,132,150,0.6); }
  .prompt::before{ content:"$ "; color:rgba(150,180,235,0.7); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="status">signal lost</div>
    <p class="msg">This route returned no telemetry. The page may have moved, or never existed.</p>
    <a class="home" href="/">return to base</a>
    <div class="prompt">trace --route requested : no path found</div>
  </div>
</body>
</html>
