<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" preserveAspectRatio="none"><!-- mask for the contact page: torn top and bottom edges (from the old-page photo), burnt-through parts of contact-burn-paper.svg cut out -->
