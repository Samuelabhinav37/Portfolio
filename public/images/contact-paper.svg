<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960">
  <!-- Aged-paper overlay for the contact card. Each layer maps noise to a
       brown with alpha, so it only ever darkens the paper colour under it.
       Tile is bigger than the card, so it never visibly repeats. -->
  <filter id="tone" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".0045" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .16  1.7 0 0 0 -.66"/>
  </filter>
  <filter id="foxing" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="21" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .3  0 0 0 0 .12  7 0 0 0 -5.05"/>
  </filter>
  <filter id="fibres" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".006 .55" numOctaves="2" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .24  0 0 0 0 .16  3.2 0 0 0 -2.05"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .22  0 0 0 0 .18  0 0 0 0 .13  1 0 0 0 -.32"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#tone)" opacity=".65"/>
  <rect width="100%" height="100%" filter="url(#foxing)" opacity=".24"/>
  <rect width="100%" height="100%" filter="url(#fibres)" opacity=".45"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity=".85"/>
</svg>
